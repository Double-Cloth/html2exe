name: Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test
